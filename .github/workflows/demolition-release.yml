name: Stage verified demolition runtime
on:
  push:
    branches: [release/demolition-20261103]
permissions:
  contents: write
jobs:
  stage:
    if: github.repository == 'TrentSterling/jetgame'
    runs-on: ubuntu-24.04
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - name: Verify and unpack runtime-only archive
        env:
          RUNTIME_URL: 'https://sdmntprcentralus.oaiusercontent.com/files/00000000-1160-81f5-86a4-34b584adfa73/raw?se=2026-11-03T07%3A31%3A58Z&sp=r&sv=2026-02-06&sr=b&scid=56015a1b-ca99-54be-b2c3-dd19a7ca5e5d&skoid=de71a0d5-fb02-4fce-be69-9296aced242b&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-11-03T00%3A31%3A45Z&ske=2026-11-04T00%3A31%3A45Z&sks=b&skv=2026-02-06&sig=NtuZ/018zHy6uieUM20jmiyk1t6xorRQ2wg/JukCV%2Bc%3D'
        run: |
          python3 - <<'PY'
          import os,io,json,zipfile,pathlib,hashlib,urllib.request
          with urllib.request.urlopen(os.environ['RUNTIME_URL'],timeout=45) as r: data=r.read(3000000)
          assert hashlib.sha256(data).hexdigest()=='7de258f7376b89eb78652aec03b196eb1a5c76d15a71e93ca7c1d57eab0c9364'
          archive=zipfile.ZipFile(io.BytesIO(data));assert set(archive.namelist())=={'manifest.json','runtime.zip'}
          manifest=json.loads(archive.read('manifest.json'))
          assert manifest['sourceCommit']=='e545a4bef4e9fc12f31eaa96bc58873afd964403' and not manifest['sourceDirty']
          payload=zipfile.ZipFile(io.BytesIO(archive.read('runtime.zip')))
          assert len(manifest['files'])==96 and set(payload.namelist())=={f['path'] for f in manifest['files']}
          assert sum(f['bytes'] for f in manifest['files'])<6000000
          for f in manifest['files']:
              p=pathlib.PurePosixPath(f['path'])
              assert not p.is_absolute() and '..' not in p.parts
              assert f['path'] in ('index.html','style.css','LICENSE','.nojekyll') or p.parts[0] in ('src','vendor','assets')
              b=payload.read(f['path']);assert len(b)==f['bytes'] and hashlib.sha256(b).hexdigest()==f['sha256']
              dest=pathlib.Path(f['path']);dest.parent.mkdir(parents=True,exist_ok=True);dest.write_bytes(b)
          print('Verified all 96 public runtime files from qualified source e545a4b')
          PY
          git rm .github/workflows/demolition-release.yml
          git config user.name 'Jet Game release bot'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src vendor assets index.html style.css LICENSE .nojekyll
          git commit -m 'Stage v0.13 durable landings, localized dents and heavier crowd impacts'
          git push origin HEAD:refs/heads/release/demolition-20261103
          git rev-parse HEAD
          git rev-parse HEAD^{tree}
